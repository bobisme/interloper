[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bobisme/interloper"
homepage = "https://github.com/bobisme/interloper"
readme = "README.md"
rust-version = "1.90"

[workspace.dependencies]
interloper = { path = "crates/interloper", version = "0.1.1" }
interloper-server = { path = "crates/interloper-server", version = "0.1.1" }
async-trait = "0.1.89"
async-stream = "0.3"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3.31"
jiff = { version = "1.0", features = ["serde"] }
mail-parser = { version = "1.0.1", default-features = false, features = ["full_encoding"] }
md-5 = "0.10"
rand = "0.9"
regex = "1.11"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wreq = { version = "6.0.0-rc.31", features = ["json", "cookies", "form", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = "3.0.0-rc.14"
urlencoding = "2"
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
# ring, not aws-lc: aws-lc and wreq's BoringSSL export clashing symbols.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
