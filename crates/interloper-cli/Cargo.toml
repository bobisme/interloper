[package]
name = "interloper-cli"
description = "The interloper command: disposable inboxes from the shell."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["email", "disposable-email", "temp-mail", "otp", "cli"]
categories = ["email", "command-line-utilities"]

[[bin]]
name = "interloper"
path = "src/main.rs"

[dependencies]
interloper.workspace = true
interloper-server.workspace = true
clap.workspace = true
clap_complete = "4.6"
clap_mangen = "0.3"
futures.workspace = true
jiff.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

# `cargo binstall interloper-cli` fetches the release archive dist builds
# instead of compiling BoringSSL.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"
