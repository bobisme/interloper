[package]
name = "interloper"
description = "Disposable-email backends behind one interface: generate an address, wait for mail, extract an OTP or link."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["email", "disposable-email", "temp-mail", "otp", "inbox"]
categories = ["email", "web-programming::http-client"]
# Fixtures are for the test suite only.
exclude = ["fixtures/"]

[dependencies]
async-trait.workspace = true
async-stream.workspace = true
base64.workspace = true
ego-tree = "0.11"
futures.workspace = true
jiff.workspace = true
mail-parser.workspace = true
md-5.workspace = true
rand.workspace = true
regex.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true
wreq.workspace = true
wreq-util.workspace = true

[features]
# Tests that reach real backends. Off by default: `cargo test --features live`.
live = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true
