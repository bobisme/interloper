[package]
name = "interloper"
description = "Disposable-email backends behind one interface: generate an address, wait for mail, extract an OTP or link."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
async-stream.workspace = true
base64.workspace = true
ego-tree = "0.11"
futures.workspace = true
jiff.workspace = true
rand.workspace = true
regex.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true
wreq.workspace = true
wreq-util.workspace = true

[features]
# Tests that reach real backends. Off by default: `cargo test --features live`.
live = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true
